aid: billease

name: Billease

image: https://billease.ph/billease_banner.png

description: Billease is a Philippine fintech company offering buy‑now‑pay‑later (BNPL) services and personal loans through its mobile app. Founded
  in 1969 as a rural bank, it now provides installment financing for online shopping, bill payments, and cash loans, targeting over 10 million
  users. The platform features zero‑interest credit lines, QR‑code payments, and integrates with thousands of merchants across the Philippines,
  regulated by the Bangko Sentral ng Pilipinas.

