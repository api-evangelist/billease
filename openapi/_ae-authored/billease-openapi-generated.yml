components:
  schemas:
    PostBeStoreAdminApiProductsSyncRequest:
      type: object
      properties:
        shop_code:
          type: string
        mer_code:
          type: string
        products:
          type: array
          description: Array of product objects as described for /products/sync.
      required:
      - shop_code
      - mer_code
      - products
    PostBeStoreAdminApiProductsSyncResponse:
      type: object
      properties:
        results:
          type: array
          description: One result per submitted product.
        id:
          type: string
        sku:
          type: integer
        operation:
          type: string
        applied:
          type: string
    GetBeTransactionsApiPingResponse:
      type: object
      properties:
        env:
          type: string
        nam:
          type: string
        srv:
          type: string
          format: date-time
        ver:
          type: string
    GetCategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          description: List of category objects with allowed device keys
    GetProductsResponse:
      type: object
      properties:
        pages:
          type: object
          description: Pagination info.
        products:
          type: array
          description: List of product objects.
    PostProductsSyncRequest:
      type: object
      properties:
        shop_code:
          type: string
          description: Shop UUID code. Issued by Billease at onboarding; different per environment.
        mer_code:
          type: string
          description: Merchant UUID code. Issued by Billease at onboarding; different per environment.
        products:
          type: array
          description: One or more product operations, max 1000. Each entry is resolved independently; the fields present determine the operation.
      required:
      - shop_code
      - mer_code
      - products
    PostProductsSyncResponse:
      type: object
      properties:
        results:
          type: array
          description: Array of result objects for each product entry.
    PostTrxTransactionRequest:
      type: object
      properties:
        order_id:
          type: string
          description: Order ID. Echo it back on every POST /trx/{id}/update call.
        trx_id:
          type: string
          description: Transaction ID (UUID). It also goes in the path of the delivery-status update calls.
        product_id:
          type: string
          description: Your product id, the same id you send us on POST /products/sync.
        amount:
          type: number
          description: Amount paid by the customer, in major currency units.
        currency:
          type: string
          description: Currency.
        created:
          type: string
          description: Timestamp when the transaction order creation was initiated on partner side.
        customer:
          type: object
          description: Recipient of the goods, and where they ship.
        sender:
          type: object
          description: The buyer, when the goods were purchased for someone else.
      required:
      - order_id
      - trx_id
      - product_id
      - amount
      - currency
      - created
      - customer
    PostTrxTransactionResponse:
      type: object
      properties:
        status:
          type: string
          description: OK
        in_stock:
          type: integer
          description: Remaining stock count.
    PostTrxIdIdRequest:
      type: object
      properties:
        items:
          type: array
          description: Array of integers non-empty unique Array of ids
        reason_refund:
          type: string
          description: Refund reason
        amount:
          type: number
          description: Amount to be refunded
    PostTrxIdIdResponse:
      type: object
      properties:
        refund_id:
          type: string
          description: Refund identifier
        refund_time:
          type: string
          description: Time of refund
        status:
          type: string
          description: Refund status
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: Be Store Admin Api
- name: Be Transactions Api
- name: Categories
- name: Products
- name: Trx
